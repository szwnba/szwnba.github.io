<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Zhang · 开源项目扫描站</title>
  <meta name="description" content="Johnson Zhang (@szwnba) 的 GitHub 原创项目档案，由 GitHub Actions 每日自动扫描生成。">
  <meta property="og:title" content="Johnson Zhang · 开源项目扫描站">
  <meta property="og:description" content="GitHub 原创项目档案 · 每日自动扫描更新">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C1320'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2322304C' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%2322304C' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23FFC24B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏：仪器铭牌 -->
  <header class="topbar">
    <div class="wrap topbar-in">
      <span class="mono topbar-brand">SCAN·STATION <em>/</em> szwnba</span>
      <span class="mono topbar-time">上次扫描 <b id="scan-time">—</b> · 每日 08:00 自动更新</span>
    </div>
  </header>

  <main class="wrap">
    <!-- 头部：身份 + 雷达 -->
    <section class="hero">
      <div class="identity">
        <p class="eyebrow mono">OPEN-SOURCE SCAN STATION</p>
        <h1>开源项目扫描站</h1>
        <div class="who">
          <img id="owner-avatar" src="" alt="" width="46" height="46">
          <div>
            <p class="owner-name" id="owner-name">—</p>
            <a class="owner-link mono" id="owner-link" href="#" target="_blank" rel="noopener">@szwnba ↗</a>
          </div>
        </div>
        <p class="owner-bio" id="owner-bio">GitHub 原创项目档案 · 公开、非 fork · 数据每日自动巡检</p>
        <dl class="stats">
          <div class="stat"><dt>项目</dt><dd id="stat-repos">—</dd></div>
          <div class="stat"><dt>Stars</dt><dd id="stat-stars" class="amber">—</dd></div>
          <div class="stat"><dt>Forks</dt><dd id="stat-forks">—</dd></div>
          <div class="stat"><dt>语言</dt><dd id="stat-langs">—</dd></div>
        </dl>
      </div>

      <figure class="radar" aria-label="项目雷达图：距圆心越近代表推送越近，光点越大代表 Star 越多，颜色代表主语言">
        <figcaption class="radar-label mono">PROJECT RADAR · <span id="radar-count">0</span> SIGNALS</figcaption>
        <div class="radar-stage">
          <svg id="radar-svg" viewBox="0 0 400 400" role="img"></svg>
          <div class="radar-sweep" aria-hidden="true"></div>
          <div class="radar-tip mono" id="radar-tip" hidden></div>
        </div>
        <p class="radar-note mono">距圆心越近 = 推送越新 · 光点大小 = STAR · 点击光点定位项目</p>
      </figure>
    </section>

    <!-- 控制台：搜索 / 语言筛选 / 排序 -->
    <section class="console">
      <div class="search-box">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="13.8" y1="13.8" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="search" id="search" placeholder="搜索项目名、描述或主题…" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="group" aria-label="按语言筛选"></div>
      <label class="sort-box mono">
        排序
        <select id="sort">
          <option value="pushed">最近更新</option>
          <option value="stars">最多 STAR</option>
          <option value="created">最新创建</option>
        </select>
      </label>
    </section>

    <p class="count-line mono" id="count-line">—</p>

    <!-- 项目卡片 -->
    <section class="cards" id="cards"></section>

    <div class="state-panel" id="empty-state" hidden>
      <p>没有匹配的项目</p>
      <p class="sub">试试清除搜索词或语言筛选。</p>
      <button class="reset-btn" id="reset-btn">清除全部筛选</button>
    </div>
    <div class="state-panel" id="error-state" hidden>
      <p>数据加载失败</p>
      <p class="sub">可能是网络波动，请稍后重试。</p>
      <button class="reset-btn" id="retry-btn">重新加载</button>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <p class="mono">数据来自 GITHUB API · 由 <a href="https://github.com/szwnba/github-showcase/actions" target="_blank" rel="noopener">GITHUB ACTIONS</a> 每日 08:00（北京时间）自动扫描</p>
      <p class="mono dim">LAST SCAN <span id="footer-time">—</span> · <a href="https://github.com/szwnba/github-showcase" target="_blank" rel="noopener">本站源码 ↗</a></p>
    </div>
  </footer>

  <noscript><p style="text-align:center;padding:40px">需要启用 JavaScript 才能查看项目数据。</p></noscript>
  <script src="app.js"></script>
</body>
</html>
